name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          install: true

      - name: Verify release version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"

      - name: Install dependencies
        run: mise x pnpm -- pnpm install --frozen-lockfile

      - name: Validate
        run: mise x pnpm -- pnpm run check

      - name: Package plugin
        run: |
          mkdir -p release
          cp package.json README.md CHANGELOG.md LICENSE release/
          cp -R dist release/dist
          if [ -f icon.png ]; then cp icon.png release/; fi
          if [ -f screenshot.png ]; then cp screenshot.png release/; fi
          cd release
          zip -r ../logseq-plugin-bidi.zip .
          cd ..
          unzip -t logseq-plugin-bidi.zip
          unzip -l logseq-plugin-bidi.zip | grep -q 'dist/index.html'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          gh release upload "$GITHUB_REF_NAME" logseq-plugin-bidi.zip --clobber
